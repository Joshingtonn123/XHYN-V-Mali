name: Build XHYN-R APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Method 1: use the repository's existing builder exactly as requested.
      - name: "Method 1 — existing Python APK builder"
        id: method1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modifications/dist modifications/reports
          python modifications/scripts/build_apk.py

      # Method 2: fetch build tools, optionally decode a user-provided APK,
      # then retry the existing Python builder with those tools available.
      - name: "Set up Android SDK tools for fallback methods"
        if: always() && steps.method1.outcome != 'success'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools build-tools;35.0.0'

      - name: "Method 2 — install Apktool and Android build tools"
        id: method2
        if: always() && steps.method1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools modifications/decoded modifications/dist modifications/reports
          # Download the latest official Apktool release JAR from its GitHub release assets.
          python - <<'PY'
          import json, urllib.request
          api = "https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"
          req = urllib.request.Request(api, headers={"Accept":"application/vnd.github+json","User-Agent":"XHYN-V-Android-Builder"})
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = [a for a in release.get("assets", []) if a["name"].lower().endswith(".jar") and "small" not in a["name"].lower()]
          if not assets:
              raise SystemExit("No official Apktool JAR asset found in latest release")
          asset = next((a for a in assets if a["name"].lower().startswith("apktool_")), assets[0])
          req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent":"XHYN-Android-Builder"})
          with urllib.request.urlopen(req, timeout=90) as r, open("tools/apktool.jar","wb") as out:
              out.write(r.read())
          print("Downloaded", asset["name"])
          PY
          # setup-android already installs the requested SDK packages above;
          # do not invoke sdkmanager a second time (that caused exit code 1).
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner" || { echo "::error::Android SDK apksigner is missing after setup-android."; exit 1; }
          test -x "$BUILD_TOOLS/zipalign" || { echo "::error::Android SDK zipalign is missing after setup-android."; exit 1; }
          test -f "$BUILD_TOOLS/lib/apksigner.jar" || { echo "::error::Android SDK apksigner.jar is missing after setup-android."; exit 1; }
          mkdir -p recovered/hotfix2/extracted/XHYN-V-r30-Hotfix2/toolchain/android-ui
          cp "$BUILD_TOOLS/lib/apksigner.jar" recovered/hotfix2/extracted/XHYN-V-r30-Hotfix2/toolchain/android-ui/apksigner.jar
          # If a lawful input APK was added to original-apk/, reconstruct the decoded
          # workspace from it. Otherwise preserve any decoded workspace already present.
          input_apk="$(find original-apk -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -n "$input_apk" && ! -f modifications/decoded/AndroidManifest.xml ]]; then
            rm -rf modifications/decoded
            java -jar tools/apktool.jar d -f "$input_apk" -o modifications/decoded
          fi
          test -f modifications/decoded/AndroidManifest.xml
          test -d modifications/decoded/lib/arm64-v8a
          python modifications/scripts/build_apk.py

      # Method 3: bypass the custom Python script and build/sign directly with
      # Apktool + Android SDK zipalign/apksigner, if a decoded workspace exists.
      - name: "Method 3 — direct Apktool build and Android SDK signing"
        id: method3
        if: always() && steps.method1.outcome != 'success' && steps.method2.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modifications/dist modifications/reports modifications/signing
          DECODED="modifications/decoded"
          APKTOOL="tools/apktool.jar"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          test -f "$DECODED/AndroidManifest.xml" || { echo "::error::No decoded AndroidManifest.xml. Add a lawful input APK at original-apk/ or provide the decoded workspace."; exit 1; }
          test -d "$DECODED/lib/arm64-v8a" || { echo "::error::No ARM64 native libraries in decoded workspace."; exit 1; }
          test -f "$APKTOOL" || { echo "::error::Apktool JAR is unavailable."; exit 1; }
          test -x "$BUILD_TOOLS/apksigner" || { echo "::error::Android SDK apksigner is unavailable."; exit 1; }
          test -x "$BUILD_TOOLS/zipalign" || { echo "::error::Android SDK zipalign is unavailable."; exit 1; }
          KEY="modifications/signing/xhyn-v-reborn.p12"
          PASSFILE="modifications/signing/password.txt"
          if [[ ! -f "$KEY" ]]; then
            umask 077
            python -c 'import secrets; print(secrets.token_urlsafe(40))' > "$PASSFILE"
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -storepass:file "$PASSFILE" -keypass:file "$PASSFILE" -alias xhyn-v-reborn -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=XHYN V, O=XHYN PH, C=PH"
          fi
          java -jar "$APKTOOL" b "$DECODED" -o modifications/dist/XHYN-R-unsigned.apk
          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 modifications/dist/XHYN-R-unsigned.apk modifications/dist/XHYN-R-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEY" --ks-key-alias xhyn-v-reborn --ks-pass "file:$PASSFILE" --key-pass "file:$PASSFILE" --out modifications/dist/XHYN-R.apk modifications/dist/XHYN-R-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs modifications/dist/XHYN-R.apk > modifications/reports/signature-verification.txt 2>&1
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path("modifications/dist/XHYN-R.apk")
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              if bad: raise SystemExit("APK ZIP verification failed: "+bad)
              names=z.namelist()
              if "classes.dex" not in names: raise SystemExit("APK is missing classes.dex")
              libs=[n for n in names if n.startswith("lib/arm64-v8a/") and n.endswith(".so")]
              if not libs: raise SystemExit("APK has no ARM64 native libraries")
          report={"file":apk.name,"bytes":apk.stat().st_size,"sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),"signature_verified":True,"device_gameplay_tested":False,"arm64_native_library_count":len(libs)}
          Path("modifications/reports/apk-verification.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Confirm an APK was produced
        if: always()
        shell: bash
        run: |
          echo "Method 1 actual outcome: ${{ steps.method1.outcome }}"
          echo "Method 2 actual outcome: ${{ steps.method2.outcome }}"
          echo "Method 3 actual outcome: ${{ steps.method3.outcome }}"
          if [[ ! -s modifications/dist/XHYN-R.apk ]]; then
            echo "APK files in modifications/dist (if any):"
            find modifications/dist -maxdepth 1 -type f -name '*.apk' -printf '  %f (%s bytes)\n' 2>/dev/null || true
            input_apk="$(find original-apk -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
            if [[ ! -f modifications/decoded/AndroidManifest.xml && -z "$input_apk" ]]; then
              echo "::error::Missing base APK/workspace: there is no modifications/decoded/AndroidManifest.xml and no APK under original-apk/. This repo's modification scripts cannot make a complete app APK from zero."
              echo "Add your own lawful base APK as original-apk/input.apk, or add the complete decoded workspace, then rerun."
            else
              echo "::error::No XHYN-R.apk was produced. Use the method outcomes above to identify the build error."
            fi
            exit 1
          fi
          echo "APK exists: modifications/dist/XHYN-R.apk"

      - name: Upload APK and verification reports
        if: always() && hashFiles('modifications/dist/XHYN-R.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-R-APK
          path: |
            modifications/dist/XHYN-R.apk
            modifications/reports/signature-verification.txt
            modifications/reports/apk-verification.json
          if-no-files-found: warn
          retention-days: 7
