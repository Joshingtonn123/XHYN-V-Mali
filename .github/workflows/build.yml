name: Build XHYN-V APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check required build inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "modifications/decoded/AndroidManifest.xml"
            "modifications/decoded/lib/arm64-v8a"
            "tools/apktool.jar"
            "recovered/hotfix2/extracted/XHYN-V-r30-Hotfix2/toolchain/android-ui/apksigner.jar"
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Missing required build input: $path"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "This repository does not currently contain every input needed by build_apk.py."
            echo "The build has stopped before running the APK builder."
            exit 1
          fi

      - name: Build and sign APK using existing Python script
        run: python modifications/scripts/build_apk.py

      - name: Upload APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-V-APK
          path: |
            modifications/dist/XHYN-V-0.1.apk
            modifications/reports/signature-verification.txt
            modifications/reports/apk-verification.json
          if-no-files-found: error
          retention-days: 7
